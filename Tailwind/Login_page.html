<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-slate-800 flex justify-center items-center h-screen">
    <div class="bg-slate-700 border-slate-950 p-6 rounded-md justify-center items-center flex-col min-w-80">
        <h2 class="text-3xl font-bold text-white text-center mb-2">Login Acc</h2>
        <form class="p-1">
            <div class="pb-1">
                <label for="text" class="block mb-1 text-white">Email</label>
                <input  class="hover:border-stone-950 w-full bg-slate-500 px-1 py-1 rounded-sm mb-2" type="text" placeholder="example@gmail.com">
            </div>
            <div class="pb-1">
                <label for="password" class="block mb-1 text-white">Password</label>
                <input type="password" placeholder="password" class="w-full mb-2 bg-slate-500 px-1 py-1 rounded-sm text-white">
            </div>
            <button class="w-full rounded-sm bg-blue-500 hover:bg-blue-600 px-1 py-1 font-bold mt-1 text-slate-700"type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
