<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Grid Practice.</h1>
    <div class="parent">
        <h2>1. Basic Grid (3x3)</h2>
        <div class="gridcon"
        style="grid-template-columns: repeat(3,1fr);
               grid-template-rows: repeat(3,70px);">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
        </div>
    </div>
    <div class="parent">
        <h2>2. Grid with Different Column Sizes</h2>
        <div class="gridcon"
        style="grid-template-columns: 1fr 2fr 1fr;
               grid-template-rows: 30px;">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </div>
    <div class="parent">
        <h2>3. Grid with Gaps</h2>
        <div class="gridcon"
        style="grid-template-columns: repeat(3,1fr);
        gap: 3px;">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </div>
    <div class="parent">
        <h2>4. Grid Item Placement</h2>
        <div class="gridcon"
        style="grid-template-columns: repeat(3,1fr);
               grid-template-rows: repeat(3,100px);">
            <div class="box" style="grid-column: 1/3;
            grid-row: 1/3;">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box" style="grid-column: 2/4;">5</div>
        </div>
    </div>
    <div class="parent">
        <h2>5. Grid Template Areas</h2>
        <div class="gridcon"
        style="grid-template-areas: 'header header header' 'sidebar main main' 'footer footer footer';
        grid-template-rows: repeat(3,80px);">
            <div class="box" style="grid-area: header;">Header</div>
            <div class="box" style="grid-area: sidebar;">sidebar</div>
            <div class="box" style="grid-area: main;">main</div>
            <div class="box" style="grid-area: footer;">footer</div>
        </div>
    </div>
</body>
</html>
